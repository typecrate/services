# =============================================================================
# typecrate-services - the Rust core behind the `@typecrate/services` npm package.
#
# WHY an explicit `[workspace]` table HERE (and not a crate under root `rust/crates`):
# the package was requested at packages/typecrate/services, and the root workspace
# (Cargo.toml) only globs `members = ["rust/crates/*"]`. Without a `[workspace]`
# boundary cargo walks up, finds the root workspace, and fails with
# "current package believes it's in a workspace when it's not". Declaring the
# boundary here keeps the requested npm location and leaves the root workspace
# untouched - the same shape packages/underload/nexus already uses.
#
# What is still inherited from the repo root (cargo config discovery walks up from
# the cwd, independently of workspace membership - see three levels up,
# ../../../.cargo/config.toml):
#   target-dir = ".rust/target"          -> artifacts stay inside the repo
#   [env] TMP/TEMP/TMPDIR = Temp/rust    -> child processes never touch OS temp
#   rust-toolchain.toml channel 1.99.1   -> pinned toolchain
#
# Native-only: this crate is an HTTP server, so there is no wasm boundary and no
# wasm target. The native runtime deps (axum/tokio) are ordinary dependencies -
# nothing is target-gated because there is only one target.
# =============================================================================

[workspace]
# 3 = the edition-2024 default (matches the root workspace).
resolver = "3"

[package]
name = "typecrate-services"
# Crate name == npm name with `@` dropped and `/` replaced by `-`
# (naming rule in ../../../rust/README.md "Name mapping rule").
version = "1.0.2"                                  # mirrors the npm line in package.json
edition = "2024"
rust-version = "1.99"                              # same floor as the root workspace
license = "MIT"
publish = false                                    # crates.io: consumed by path, not published
description = "Rust-native core for @typecrate/services: the native HTTP server and its build-time route discovery."

[lib]
name = "typecrate_services"                        # in Rust code: `use typecrate_services::...`
path = "src/lib.rs"
# rlib -> native consumers (crate-to-crate linking) and `cargo test`.
crate-type = ["rlib"]

# The native HTTP executable (R1). Declared explicitly so the artifact/bin name is
# stable and greppable (`cargo run --bin typecrate-services-server`) instead of
# cargo's autodiscovered `server`; naming a path here is also what stops
# autodiscovery from creating a second target for the same file.
[[bin]]
name = "typecrate-services-server"
path = "src/bin/server.rs"

[dependencies]
# Native runtime. Versions/features mirror packages/underload/nexus
# (crates/nexus-server) so the repo resolves one axum/tokio/serde/reqwest graph,
# not two parallel ones.
#
# `json` + `query` are the extractors the service endpoints actually use (POST JSON
# bodies, GET query strings); axum's default features already bring http1 + tokio,
# which is what `axum::serve` in src/bin/server.rs needs.
#
# `ws` is here for the harness gateway (T6): the discovered
# `packages/typecrate/harness/endpoint/harness/harness-route.rs` module is compiled INTO this
# crate, so axum is one build unit for both - and the `harness.v1` upgrade at
# `/v1/harness/stream` needs `axum::extract::ws` to exist in it. Feature unification would
# already pull it in through the harness path dependency, but stating it keeps this crate's own
# surface honest: it does speak an upgrade now, not only request/response HTTP.
axum = { version = "0.8", features = ["json", "query", "ws"] }
# Multi-thread runtime + macro support for `#[tokio::main]`/`#[tokio::test]`, the
# listener, timeouts (test shutdown), and ctrl_c/SIGTERM for graceful shutdown.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
# Derives for the endpoint request/response DTOs in the generated route files.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# T6: the `/v1/harness` gateway. `packages/typecrate/harness/endpoint/harness/harness-route.rs`
# is a discovered route file, i.e. a module of THIS crate, and it calls
# `typecrate_harness::api::{handle_request, handle_stream}` - so the harness library has to link
# here. The edge points one way only: `typecrate-harness` has no dependency on services (its
# manifest lists no path dependencies at all), so this cannot form a cycle.
typecrate-harness = { path = "../harness" }
# C4: the `/providers/private/v1` surface. `packages/typecrate/provider/endpoint/provider/provider-route.rs`
# is a discovered route file, i.e. a module of THIS crate, and it calls
# `typecrate_provider::serve::{chat_completions, responses, models, stats}` - so the provider
# library has to link here. The edge points one way only: `typecrate-harness` above is the only
# path dependency the provider manifest lists (services is not in it), so this cannot form a cycle.
#
# The dependency is a plain path dependency with NO features and NO `default-features = false`: the
# provider crate declares no cargo features at all, and its surface here is only the `serve` module,
# which needs nothing beyond the provider crate's own runtime deps (reqwest/serde_json/tokio/
# tokio-util/futures-util - all already in this graph at the same versions, which is why adding this
# line adds no new crate to `Cargo.lock`, only the two path entries).
typecrate-provider = { path = "../provider" }
# The log surface (the "output all logs" half of this crate). `tracing` is here because the
# `typecrate-provider` tasks this binary links already log through its facade
# (`provider/src/serve.rs` / `client.rs` / `transport.rs` / `vault.rs`) and, with NO
# `tracing::Subscriber` installed anywhere in the process, every one of those events was being
# thrown away. `src/logging.rs` installs the subscriber; `src/server/request_log.rs` emits the
# gateway's per-request line through the same facade.
#
# `default-features = false, features = ["std"]` is the provider's recipe verbatim
# (`packages/typecrate/provider/Cargo.toml:83`) and it is load-bearing offline: tracing's DEFAULT
# feature set includes `attributes`, the only thing that pulls `tracing-attributes`, which appears
# in NEITHER sibling lockfile (axum and tokio ask for `tracing` with `default-features = false`).
# This workspace has no vendored registry, so a feature set that adds a package the cargo cache has
# never downloaded cannot be resolved here at all.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# Declared directly because `src/logging.rs` IMPLEMENTS the subscriber trait: `Subscriber`,
# `Metadata`, `Event`, `LevelFilter`, `span::*` and `field::Visit` are all `tracing-core` items
# that `tracing` only re-exports. Naming the crate is what keeps that implementation's types
# resolvable if a future `tracing` release reshuffles its re-export list, and it adds no crate
# either: `tracing` already resolves `tracing-core` 0.1.36 in this lock.
tracing-core = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
# tests/server_http.rs dials the real listener over a real TCP socket; no stubbed
# transport. No TLS feature: every test URL is http://127.0.0.1:<ephemeral>.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# `ignore` is a BUILD dependency for build.rs, but tests/discovery.rs (T11) compiles
# `build_support/` into the TEST crate with `#[path]` (a build script has no rlib an
# integration test can link), and a build-dependency is not visible to any other
# target - so the same version is declared here too, for native test builds.
ignore = "0.4"
# tests/harness_gateway.rs (T6) completes the `harness.v1` handshake over the SAME router the
# executable serves, which needs an RFC 6455 client. The same version the harness crate already
# resolves for its own stream suite (`packages/typecrate/harness/Cargo.toml` dev-deps).
tokio-tungstenite = "0.29"
# `WebSocketStream` is a `futures` `Stream` + `Sink` (tokio-tungstenite 0.29 exposes no inherent
# send/recv and re-exports nothing from futures), so the frame conversation needs these two extension
# traits. Also already in the graph as a dependency of both axum and tokio-tungstenite, i.e. this
# adds a dev-dependency line without adding a crate to the build.
futures-util = "0.3"

[build-dependencies]
# Owned by the build-time scanner in build.rs (T11): `ignore` walks the tree with
# .gitignore/.ignore semantics, which is how the Rust discovery matches the TS
# endpoint scanner instead of re-implementing gitignore by hand.
ignore = "0.4"

# Lint policy copied from the root workspace ([workspace.lints]) because a
# standalone workspace does not inherit another workspace's lint table.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Release profile mirrors the root workspace ([profile.release]): this workspace is
# separate, so the settings have to be restated.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
